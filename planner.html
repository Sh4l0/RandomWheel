<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Planner</title>
<style>
:root{--raise:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;--sink:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000;--gr:#006b2d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#008060;color:#000;font:15px/1.35 "MS Sans Serif","Microsoft Sans Serif",Tahoma,Arial,sans-serif;overflow-x:hidden}
.win{max-width:720px;margin:14px auto;background:#c0c0c0;padding:3px;box-shadow:var(--raise),4px 4px 0 #00000066;width:calc(100% - 20px)}
.title{display:flex;align-items:center;gap:6px;background:var(--gr);color:#fff;font-weight:bold;padding:3px 4px}
.title span:first-child{flex:1}
.btns{display:flex;gap:2px}
.btns b{width:18px;height:16px;background:#c0c0c0;color:#000;box-shadow:var(--raise);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.menu{display:flex;gap:16px;padding:3px 8px;border-bottom:1px solid #808080;box-shadow:0 1px 0 #fff}
.body{padding:12px 10px 10px}
.tag{margin:0 0 14px}
.panel,.hour{border:1px solid #808080;box-shadow:1px 1px 0 #fff,inset 1px 1px 0 #fff;padding:14px 10px 10px;margin:16px 0 12px;position:relative}
.panel h2{position:absolute;top:-10px;left:8px;margin:0;background:#c0c0c0;padding:0 4px;font-size:15px;font-weight:normal}
button{font:inherit;color:#000;background:#c0c0c0;border:0;box-shadow:var(--raise);padding:4px 14px;min-width:72px;cursor:default}
button:active:not(:disabled){box-shadow:var(--sink);padding:5px 13px 3px 15px}
button:disabled{color:#808080;text-shadow:1px 1px #fff}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
input[type=text],select{font:inherit;background:#fff;color:#000;border:0;box-shadow:var(--sink);padding:3px 5px;min-width:0}
input:focus-visible,select:focus-visible{outline:2px solid var(--gr);outline-offset:1px}
input[type=checkbox]{accent-color:var(--gr)}
.sp{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.cfg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.cfg label{display:flex;align-items:center;gap:6px}
#saved{color:var(--gr);font-weight:bold}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.time{font-weight:bold;font-size:17px;min-width:84px;padding:1px 6px;background:#fff;box-shadow:var(--sink)}
.hour.now .time{background:var(--gr);color:#fff}
.loc{flex:1;display:flex;align-items:center;gap:8px;min-width:200px}
.loc input{flex:1;width:100%}
.items{list-style:none;margin:8px 0 6px;padding:0}
.items li{display:flex;align-items:center;gap:8px;padding:2px 0}
.items li span{flex:1;word-break:break-word}
.items li.done span{text-decoration:line-through;color:#606060}
.items input[type=checkbox]{width:16px;height:16px;flex:none}
.items button{min-width:0;padding:0 8px}
.add{display:flex;gap:6px}
.add input{flex:1}
</style>
</head>
<body>
<main class="win">
  <div class="title"><span>Day Planner</span><span class="btns" aria-hidden="true"><b>_</b><b>&#9633;</b><b>x</b></span></div>
  <div class="menu" aria-hidden="true"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>H</u>elp</span></div>
  <div class="body">
  <p class="tag">Choose which hours to show, then fill in each one. Changes save automatically.</p>
  <section class="panel cfg" aria-label="Hours to display">
    <label>From <select id="start"></select></label>
    <label>To <select id="end"></select></label>
    <span class="sp"></span>
    <span id="saved" role="status"></span>
    <button class="ghost" id="reset">Clear day</button>
  </section>
  <div id="hours"></div>
</div></main>
<script>
(function(){
var KEY='day-planner-v1',$=function(i){return document.getElementById(i)};
var st={start:8,end:22,hours:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){st.start=+p.start>=0?+p.start:8;st.end=+p.end>=0?+p.end:22;st.hours=p.hours||{}}}}catch(e){}
var tm;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(st));$('saved').textContent='Saved'}
  catch(e){$('saved').textContent='Could not save (storage blocked)'}
  clearTimeout(tm);tm=setTimeout(function(){$('saved').textContent=''},1800);
}
function lbl(h){var s=h<12?'am':'pm',n=h%12===0?12:h%12;return n+':00 '+s}
function get(h){if(!st.hours[h])st.hours[h]={loc:'',items:[]};return st.hours[h]}
['start','end'].forEach(function(id){
  var s=$(id);for(var h=0;h<24;h++){var o=document.createElement('option');o.value=h;o.textContent=lbl(h);s.appendChild(o)}
  s.value=st[id];
  s.onchange=function(){
    st[id]=+s.value;
    if(st.end<st.start){if(id==='start'){st.end=st.start;$('end').value=st.end}else{st.start=st.end;$('start').value=st.start}}
    save();render();
  };
});
function el(t,c,tx){var e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e}
function render(){
  var box=$('hours');box.innerHTML='';
  var now=new Date().getHours();
  for(var h=st.start;h<=st.end;h++)(function(h){
    var d=get(h),sec=el('section','hour'+(h===now?' now':''));
    var head=el('div','head');
    head.appendChild(el('span','time',lbl(h)));
    head.appendChild(el('span','bar','|'));
    var lw=el('label','loc','Location:'),li=el('input');
    li.type='text';li.value=d.loc;li.placeholder='Where are you?';li.maxLength=60;li.setAttribute('aria-label','Location for '+lbl(h));
    li.oninput=function(){d.loc=li.value;save()};
    lw.appendChild(li);head.appendChild(lw);sec.appendChild(head);
    var ul=el('ul','items');
    d.items.forEach(function(it,i){
      var r=el('li',it.d?'done':''),cb=el('input');cb.type='checkbox';cb.checked=!!it.d;cb.setAttribute('aria-label','Done: '+it.t);
      cb.onchange=function(){it.d=cb.checked;r.className=it.d?'done':'';save()};
      var x=el('button','ghost','×');x.setAttribute('aria-label','Remove '+it.t);
      x.onclick=function(){d.items.splice(i,1);save();render()};
      r.append(cb,el('span','','- '+it.t),x);ul.appendChild(r);
    });
    sec.appendChild(ul);
    var ad=el('div','add'),ai=el('input');ai.type='text';ai.placeholder='Add an action item';ai.maxLength=100;ai.setAttribute('aria-label','New action item for '+lbl(h));
    var ab=el('button','','Add');
    function add(){var v=ai.value.trim();if(!v)return;d.items.push({t:v,d:false});save();render();
      var n=$('hours').querySelectorAll('.hour')[h-st.start];if(n)n.querySelector('.add input').focus()}
    ab.onclick=add;ai.onkeydown=function(e){if(e.key==='Enter')add()};
    ad.append(ai,ab);sec.appendChild(ad);box.appendChild(sec);
  })(h);
}
$('reset').onclick=function(){
  if(!confirm('Clear all locations and action items for every hour?'))return;
  st.hours={};save();render();
};
render();
document.fonts&&document.fonts.ready.then(function(){});
})();
</script>
</body>
</html>
