<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the Wheel</title>
<style>
:root{--raise:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;--sink:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000;--gr:#006b2d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#008060;color:#000;font:15px/1.35 "MS Sans Serif","Microsoft Sans Serif",Tahoma,Arial,sans-serif;overflow-x:hidden}
.win{max-width:940px;margin:14px auto;background:#c0c0c0;padding:3px;box-shadow:var(--raise),4px 4px 0 #00000066;width:calc(100% - 20px)}
.title{display:flex;align-items:center;gap:6px;background:var(--gr);color:#fff;font-weight:bold;padding:3px 4px}
.title span:first-child{flex:1}
.btns{display:flex;gap:2px}
.btns b{width:18px;height:16px;background:#c0c0c0;color:#000;box-shadow:var(--raise);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.menu{display:flex;gap:16px;padding:3px 8px;border-bottom:1px solid #808080;box-shadow:0 1px 0 #fff}
.body{padding:12px 10px 10px}
.tag{margin:0 0 14px}
.panel,.hour{border:1px solid #808080;box-shadow:1px 1px 0 #fff,inset 1px 1px 0 #fff;padding:14px 10px 10px;margin:16px 0 12px;position:relative}
.panel h2{position:absolute;top:-10px;left:8px;margin:0;background:#c0c0c0;padding:0 4px;font-size:15px;font-weight:normal}
button{font:inherit;color:#000;background:#c0c0c0;border:0;box-shadow:var(--raise);padding:4px 14px;min-width:72px;cursor:default}
button:active:not(:disabled){box-shadow:var(--sink);padding:5px 13px 3px 15px}
button:disabled{color:#808080;text-shadow:1px 1px #fff}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
input[type=text],select{font:inherit;background:#fff;color:#000;border:0;box-shadow:var(--sink);padding:3px 5px;min-width:0}
input:focus-visible,select:focus-visible{outline:2px solid var(--gr);outline-offset:1px}
input[type=checkbox]{accent-color:var(--gr)}
.sp{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.grid{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:820px){.grid{grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}}
.stage{display:flex;flex-direction:column;align-items:center}
.wheelwrap{position:relative;width:min(100%,440px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-6px;left:50%;margin-left:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:32px solid #000;z-index:3}
#spin{margin-top:14px;font-weight:bold;font-size:17px;padding:8px 40px;box-shadow:var(--raise),0 0 0 1px #000}
#result{margin-top:14px;min-height:70px;width:100%;background:#fff;box-shadow:var(--sink);text-align:center;padding:8px;display:flex;flex-direction:column;justify-content:center}
#result b{font-size:clamp(20px,5.5vw,28px);color:var(--gr);word-break:break-word}
#result.win{animation:blink .4s steps(1) 4}
@keyframes blink{50%{background:var(--gr);color:#fff}}
#result.win b{color:inherit}
.row{display:flex;gap:6px}
.row input{flex:1}
ul{list-style:none;margin:10px 0;padding:2px;max-height:260px;overflow-y:auto;background:#fff;box-shadow:var(--sink)}
li{display:flex;align-items:center;gap:8px;padding:2px 4px}
li i{width:12px;height:12px;flex:none;border:1px solid #000}
li span{flex:1;word-break:break-word}
li button{min-width:0;padding:0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;margin-top:10px}
.note{margin:8px 0 0;color:#404040}
</style>
</head>
<body>
<main class="win">
  <div class="title"><span>Spin the Wheel</span><span class="btns" aria-hidden="true"><b>_</b><b>&#9633;</b><b>x</b></span></div>
  <div class="menu" aria-hidden="true"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>H</u>elp</span></div>
  <div class="body">
  <p class="tag">Add your options, then spin for a random pick.</p>
  <div class="grid">
    <section class="panel stage" aria-label="Wheel">
      <div class="wheelwrap"><div class="ptr"></div><canvas id="c" width="920" height="920" aria-label="Spinning wheel"></canvas></div>
      <button id="spin">Spin</button>
      <div id="result" role="status" aria-live="polite">Add at least 2 options to spin</div>
    </section>
    <section class="panel" aria-label="Options">
      <h2>Options</h2>
      <div class="row"><input type="text" id="in" placeholder="Type an option" maxlength="40" aria-label="New option"><button id="add">Add</button></div>
      <ul id="list"></ul>
      <div class="bar"><button class="ghost" id="bulk">Paste many</button><button class="ghost" id="shuf">Shuffle</button><button class="ghost" id="clear">Clear all</button></div>
      <label class="opt"><input type="checkbox" id="rm"> Remove the winner after each spin</label>
      <p class="note" id="note"></p>
    </section>
  </div>
</div></main>
<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),S=920,C=S/2;
var opts=['pizza','tacos','sushi','ramen','burgers','salad'],rot=0,spinning=false;
var cols=['#006b2d','#c0c0c0','#2e9e4f','#ffffff','#004d1f','#9fd6ae'];
function tc(h){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return (r*299+g*587+b*114)/1000<140?'#fff':'#000'}
var $=function(i){return document.getElementById(i)};
// binary rain strip

function draw(){
  x.clearRect(0,0,S,S);
  var n=opts.length,a=Math.PI*2/Math.max(n,1);
  x.save();x.translate(C,C);
  x.beginPath();x.arc(0,0,C-4,0,7);x.fillStyle='#c0c0c0';x.fill();x.lineWidth=4;x.strokeStyle='#000';x.stroke();
  x.beginPath();x.arc(0,0,C-13,0,7);x.lineWidth=4;x.strokeStyle='#fff';x.stroke();
  x.rotate(rot);
  if(!n){x.fillStyle='#fff';x.beginPath();x.arc(0,0,C-30,0,7);x.fill();}
  for(var i=0;i<n;i++){
    var col=cols[i%cols.length];
    x.beginPath();x.moveTo(0,0);x.arc(0,0,C-30,i*a,(i+1)*a);x.closePath();
    x.fillStyle=col;x.fill();x.lineWidth=3;x.strokeStyle='#000';x.stroke();
    x.save();x.rotate(i*a+a/2);x.textAlign='right';x.textBaseline='middle';
    var t=opts[i];if(t.length>16)t=t.slice(0,15)+'\u2026';
    var fs=Math.max(22,Math.min(46,220/Math.max(n,3)*1.3));
    x.font='bold '+fs+'px "MS Sans Serif","Microsoft Sans Serif",Tahoma,Arial,sans-serif';
    x.fillStyle=tc(col);
    x.fillText(t,C-62,0);x.restore();
  }
  x.restore();
  x.save();x.translate(C,C);
  x.beginPath();x.arc(0,0,44,0,7);x.fillStyle='#c0c0c0';x.fill();x.lineWidth=4;x.strokeStyle='#000';x.stroke();
  x.beginPath();x.arc(0,0,38,0,7);x.lineWidth=3;x.strokeStyle='#fff';x.stroke();
  x.beginPath();for(var k=0;k<10;k++){var r=k%2?10:24,an=-Math.PI/2+k*Math.PI/5;x.lineTo(Math.cos(an)*r,Math.sin(an)*r)}
  x.closePath();x.fillStyle='#006b2d';x.fill();
  x.restore();
}
function render(){
  var l=$('list');l.innerHTML='';
  opts.forEach(function(o,i){
    var li=document.createElement('li'),sw=document.createElement('i'),sp=document.createElement('span'),bt=document.createElement('button');
    sw.style.background=cols[i%cols.length];sp.textContent=o;bt.textContent='×';bt.className='ghost';bt.setAttribute('aria-label','Remove '+o);
    bt.onclick=function(){if(spinning)return;opts.splice(i,1);render()};
    li.append(sw,sp,bt);l.appendChild(li);
  });
  $('spin').disabled=opts.length<2||spinning;
  $('note').textContent=opts.length+' option'+(opts.length==1?'':'s');
  if(!spinning&&opts.length<2){$('result').className='';$('result').textContent='Add at least 2 options to spin'}
  draw();
}
function add(){
  var v=$('in').value.trim();if(!v||spinning)return;
  opts.push(v);$('in').value='';render();$('in').focus();
}
$('add').onclick=add;
$('in').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
$('bulk').onclick=function(){
  if(spinning)return;
  var t=prompt('Paste options, one per line (or separated by commas):');
  if(!t)return;
  t.split(/[\n,]+/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){opts.push(s.slice(0,40))});
  render();
};
$('shuf').onclick=function(){if(spinning)return;for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t}render()};
$('clear').onclick=function(){if(spinning)return;opts=[];render()};

$('spin').onclick=function(){
  if(spinning||opts.length<2)return;
  spinning=true;$('spin').disabled=true;
  var res=$('result');res.className='';res.textContent='Spinning...';
  var n=opts.length,a=Math.PI*2/n;
  var pick=Math.floor(Math.random()*n);
  // pointer is at top (-PI/2). segment center angle must land there.
  var target=-Math.PI/2-(pick*a+a/2)+(Math.random()-.5)*a*.8;
  var cur=((rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  var tn=((target%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  var delta=(tn-cur+Math.PI*2)%(Math.PI*2)+Math.PI*2*(6+Math.floor(Math.random()*3));
  var start=rot,dur=5200,t0=performance.now();
  (function f(now){
    var p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    rot=start+delta*e;draw();
    if(p<1)return requestAnimationFrame(f);
    spinning=false;
    var w=opts[pick];
    res.className='win';res.innerHTML='<span>The winner is:</span><b></b>';res.querySelector('b').textContent=w;
    if($('rm').checked){opts.splice(pick,1);}
    var keep=res.innerHTML,kc=res.className;
    render();
    if(opts.length>=2||$('rm').checked){res.innerHTML=keep;res.className=kc}
  })(t0);
};
render();
document.fonts&&document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
